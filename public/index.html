<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Stack To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>My Tasks</h1>
        </div>
        <form id="task-form">
            <input type="text" id="task-input" placeholder="What needs to be done?" autocomplete="off" required>
            <button type="submit">Add Task</button>
        </form>
        <ul id="task-list">
            <!-- Tasks from the server will be rendered here -->
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
